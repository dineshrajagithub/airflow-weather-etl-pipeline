name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check etl tests
      - name: Unit tests
        run: pytest -q

  dag-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Airflow (with official constraints)
        run: |
          pip install "apache-airflow[postgres]==2.10.5" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt"
          pip install pandas requests boto3 pytest
      - name: Check DAG imports
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          airflow db migrate
          pytest -q tests/test_dag_integrity.py
